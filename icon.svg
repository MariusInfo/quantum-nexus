<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- App Icon Background (Rounded Squircle for macOS / iOS / Android) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#coreGlow)" opacity="0.35" />

  <!-- Outer Quantum Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad1)" stroke-width="6" stroke-dasharray="36 20" opacity="0.8" />
  <circle cx="256" cy="66" r="10" fill="#38bdf8" />
  <circle cx="256" cy="446" r="10" fill="#a855f7" />

  <!-- Atomic Orbits -->
  <g transform="translate(256, 256)">
    <ellipse rx="165" ry="68" fill="none" stroke="url(#ringGrad1)" stroke-width="7" transform="rotate(30)" opacity="0.85" />
    <ellipse rx="165" ry="68" fill="none" stroke="url(#ringGrad1)" stroke-width="7" transform="rotate(-30)" opacity="0.85" />
    <ellipse rx="165" ry="68" fill="none" stroke="url(#ringGrad2)" stroke-width="6" transform="rotate(90)" opacity="0.75" />
  </g>

  <!-- Inner High-Energy Ring -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="#ec4899" stroke-width="5" stroke-dasharray="28 32" opacity="0.7" />

  <!-- Central Singularity Core -->
  <circle cx="256" cy="256" r="88" fill="url(#coreGlow)" />
  <circle cx="256" cy="256" r="46" fill="#ffffff" />
</svg>
